<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Quotly</title>
  <style>
    :root { --brand:#1459c8; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
           background:#f6f7fb; color:#1a1d24; display:flex; min-height:100vh;
           align-items:center; justify-content:center; padding:24px; }
    .card { background:#fff; border-radius:18px; padding:32px 26px; max-width:420px; width:100%;
            box-shadow:0 10px 30px rgba(20,89,200,.10); text-align:center; }
    .logo { font-size:26px; font-weight:800; color:var(--brand); letter-spacing:.5px; }
    h1 { font-size:19px; margin:18px 0 10px; }
    p { font-size:15px; line-height:1.6; color:#475062; margin:0 0 8px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Quotly</div>
    <h1>האפליקציה בהפסקה זמנית</h1>
    <p>אנחנו עושים כמה שינויים מאחורי הקלעים. ההורדה לא זמינה כרגע.</p>
    <p>אם כבר התקנת — האפליקציה שלך ממשיכה לעבוד כרגיל.</p>
    <p>תודה על הסבלנות 🙏</p>
  </div>
</body>
</html>
